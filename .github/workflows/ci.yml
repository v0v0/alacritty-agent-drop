name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            macos_min: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            macos_min: '11.0'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            macos_min: '10.15'
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            macos_min: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set macOS minimum deployment version
        if: runner.os == 'macOS'
        shell: bash
        env:
          MIN_VERSION: ${{ matrix.macos_min }}
        run: echo "MACOSX_DEPLOYMENT_TARGET=$MIN_VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test binary
        shell: bash
        run: ./target/${{ matrix.target }}/release/agentdrop --version
      - name: Package binaries, documentation and checksums
        run: python scripts/release.py package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - run: python3 tests/e2e.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/release.py validate

  verify-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: python scripts/release.py checksums
