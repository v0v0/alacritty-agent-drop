[package]
name = "alacritty-agent-drop"
version = "0.3.0"
edition = "2024"
description = "Drag and paste local images into remote agent CLIs through Alacritty and tssh"
license = "MIT"
repository = "https://github.com/v0v0/alacritty-agent-drop"

[[bin]]
name = "agentdrop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
